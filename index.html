/* ================= Ao vivo ================= */
let wakeLock = null, tickTimer = null, lastAdvance = 0;
const putCache = new Map();

function liveDay() {
  const byId = id => state.days.find(d => d.id === id);
  return (live.startedAt && byId(live.dayId)) || byId(settings.liveDayId) || state.days.find(d => d.date === todayISO()) || planDay();
}
// Hora planeada de início em milissegundos, ancorada ao dia de hoje (permite ensaios noutro dia).
function defaultBase(day) {
  const t = now();
  const d = new Date(t); d.setHours(0, 0, 0, 0);
  let base = d.getTime() + (parseHM(day.start) || 0) * 60000;
  if (t - base > 18 * 3600e3) base += 864e5; else if (base - t > 18 * 3600e3) base -= 864e5;
  return base;
}

function computeLive(day) {
  const plan = buildPlan(day);
  const moments = plan.items.filter(it => it.kind === 'block' || it.duration > 0);
  const active = !!(live.startedAt && live.dayId === day.id);
  const ended = active && !!live.endedAt;
  const base = active && live.base ? live.base : defaultBase(day);
  const abs = m => base + (m - plan.start) * 60000;
  const t = now();
  const rows = moments.map(m => ({ m, ps: abs(m.start), pe: abs(m.end), eff: Math.max(0, m.duration + (active ? (live.adjust[m.key] || 0) : 0)) * 60000, status: 'todo', as: null, ae: null, js: null, je: null }));
  let idx = -1;
  if (active && rows.length) {
    idx = rows.findIndex(r => r.m.key === live.currentKey);
    if (idx < 0) { for (let i = rows.length - 1; i >= 0; i--) if (live.starts[rows[i].m.key] != null) { idx = i; break; } }
    if (idx < 0) idx = 0;
  }
  let cursor = null;
  rows.forEach((r, i) => {
    if (!active) {
      if (i === 0) cursor = Math.max(t, r.ps);
      r.js = cursor; r.je = cursor + r.eff; cursor = r.je;
      r.status = i === 0 ? 'next' : 'todo';
    } else if (i < idx || (ended && i === idx)) {
      r.status = 'done'; r.as = live.starts[r.m.key] ?? null;
    } else if (i === idx) {
      r.status = 'current'; r.as = live.starts[r.m.key] ?? t;
      r.js = r.as; r.je = Math.max(r.as + r.eff, t); cursor = r.je;
    } else if (cursor != null) {
      r.status = i === idx + 1 ? 'next' : 'todo';
      r.js = cursor; r.je = cursor + r.eff; cursor = r.je;
    }
  });
  rows.forEach((r, i) => {
    if (r.status !== 'done') return;
    for (let j = i + 1; j < rows.length; j++) if (rows[j].as != null) { r.ae = rows[j].as; return; }
    if (ended) r.ae = live.endedAt;
  });
  const cur = active && !ended ? rows[idx] : null;
  const plannedEnd = abs(plan.end);
  let delayMs = 0, projEnd = plannedEnd;
  if (rows.length) {
    if (!active) { delayMs = rows[0].js - rows[0].ps; projEnd = rows[rows.length - 1].je; }
    else if (ended) { projEnd = live.endedAt; delayMs = live.endedAt - plannedEnd; }
    else { delayMs = cur.je - cur.pe; projEnd = rows[rows.length - 1].je ?? cur.je; }
  }
  const limitMs = plan.limitAbs != null ? abs(plan.limitAbs) : null;
  return {
    day, plan, rows, idx, cur, active, ended, base, plannedEnd, projEnd, delayMs, limitMs,
    overLimitMs: limitMs != null ? projEnd - limitMs : null,
    remaining: cur ? cur.as + cur.eff - t : null,
  };
}

function nowHTML(L) {
  if (!L.rows.length) return '<div class="lv-label">Agora</div><h2 class="lv-title">Sem programa</h2><p class="lv-meta">Este dia não tem blocos. Adicione-os no planeamento.</p>';

  }

      <div class="lv-actions"><button type="button" class="btn lv-undo" data-action="live-undo">${icon('undo')} Retomar</button>
      <button type="button" class="btn lv-advance" data-action="live-reset"><span class="row">${icon('reset')} Reiniciar</span><small>apaga as horas reais registadas</small></button></div>`;
  }
  const r = L.cur, m = r.m;
  const adj = live.adjust[m.key] || 0;
  const isLast = L.idx === L.rows.length - 1;
  const isTrans = m.kind === 'trans';
  const adjTxt = adj ? `${adj > 0 ? '+' : '−'}${Math.abs(adj)} min` : '±0 min';
  return `<div class="lv-top"><div class="lv-label">Agora · ${esc(isTrans ? 'Transição' : typeLabel(m.block.type))}</div><div class="lv-planned">previsto ${fmtClock(r.ps)}–${fmtClock(r.pe)}</div></div>
    <h2 class="lv-title">${esc(momentTitle(m))}</h2>
    ${metaHTML(m)}
    <div class="lv-countrow">
      <div><div class="lv-countlabel" id="lv-countlabel"></div><div class="lv-count" id="lv-count"></div></div>
      <div class="lv-startinfo">Começou às <b>${fmtClock(r.as)}</b><br>${deltaWords(Math.round((r.as - r.ps) / 60000))}<br>Duração <b>${fmtDur(r.eff / 60000)}</b>${adj ? ` (ajuste ${adjTxt})` : ''}</div>
    </div>
    <div class="lv-bar" id="lv-barwrap"><i id="lv-bar"></i></div>
    <div class="lv-adjust" role="group" aria-label="Encurtar ou alongar o momento atual">
      <span class="lv-adjlabel">Ajustar</span>
      <button type="button" class="btn" data-action="live-adjust" data-delta="-5" aria-label="Encurtar 5 minutos">−5</button>
      <button type="button" class="btn" data-action="live-adjust" data-delta="-1" aria-label="Encurtar 1 minuto">−1</button>
      <span class="lv-adjval">${adjTxt}</span>
      <button type="button" class="btn" data-action="live-adjust" data-delta="1" aria-label="Alongar 1 minuto">+1</button>
      <button type="button" class="btn" data-action="live-adjust" data-delta="5" aria-label="Alongar 5 minutos">+5</button>
    </div>
    ${isTrans ? checklistHTML(m.trans, 'Checklist desta transição') : ''}
    ${!isTrans && m.block.songs.length ? songsHTML(m.block.songs, 'lv-songs') : ''}
    ${!isTrans && m.block.notes ? `<p class="lv-notes">${esc(m.block.notes)}</p>` : ''}
    <div class="lv-actions">
      <button type="button" class="btn lv-undo" data-action="live-undo">${icon('undo')} Desfazer</button>
      <button type="button" class="btn primary lv-advance" data-action="live-advance">${isLast
        ? `<span class="row">${icon('check')} Terminar</span><small>regista a hora real de fim</small>`
        : `<span class="row">Avançar ${icon('next')}</span><small>para: ${esc(momentTitle(L.rows[L.idx + 1].m))}</small>`}</button>
    </div>`;
}

function nextHTML(L, day) {
  if (!L.rows.length) return '<div class="lv-label">A seguir</div><p class="lv-after">—</p>';
  if (L.ended) return '<div class="lv-label">A seguir</div><p class="lv-after">Não há mais momentos neste dia.</p>';
  if (!L.active) return `<div class="lv-label">A seguir</div>${nextBlockHTML(L.rows[0], 0)}`;
  const m = L.cur.m;
  if (m.kind === 'block') {
    const nb = day.blocks[m.index + 1];
    if (!nb) return `<div class="lv-label">A seguir</div><p class="lv-after">É o último momento do dia. Fim projetado às <b>${fmtClock(L.projEnd)}</b>.</p>`;
    const tr = peekTrans(day, m.block, nb);
    const bi = L.rows.findIndex(r => r.m.kind === 'block' && r.m.block.id === nb.id);
    return `<div class="lv-label">A seguir</div>
      ${checklistHTML(tr, tr.duration ? `Transição · ${fmtDur(tr.duration)}` : 'Transição imediata')}
      ${bi >= 0 ? nextBlockHTML(L.rows[bi], bi) : ''}`;
  }
  const bi = L.idx + 1;
  const r = L.rows[bi];
  if (!r) return '<div class="lv-label">A seguir</div><p class="lv-after">Não há mais momentos neste dia.</p>';
  const after = day.blocks[r.m.index + 1];
  const t2 = after ? peekTrans(day, r.m.block, after) : null;
  return `<div class="lv-label">A seguir</div>${nextBlockHTML(r, bi)}
    ${after ? `<p class="lv-after">Depois deste bloco: transição para «${esc(after.title)}» · ${plural(t2.items.length, 'ação', 'ações')}</p>` : ''}`;
}

function nextBlockHTML(r, rowIndex) {
  const b = r.m.block;
  return `<div class="lv-nb t-${b.type}">
    <div class="lv-nb-time"><span data-proj-row="${rowIndex}">~${fmtClock(r.js)}</span><small>previsto ${fmtClock(r.ps)}</small></div>
    <div><span class="type-chip">${esc(typeLabel(b.type))}</span><h3>${esc(b.title)}</h3>
      <p class="lv-meta">${b.owner ? `<span>${icon('user')}${esc(b.owner)}</span>` : ''}${b.place ? `<span>${icon('pin')}${esc(b.place)}</span>` : ''}<span>${icon('clock')}${fmtDur(b.duration)}</span></p>
      ${b.songs.length ? `<p class="lv-nb-songs">${icon('music')}<span>${songsInline(b.songs)}</span></p>` : ''}</div>
  </div>`;
}

function checklistHTML(tr, head) {
  const items = tr.items || [];
  const done = items.filter(x => live.checks[x.id]).length;
  return `<div class="lv-chk">
    <div class="lv-chk-head"><b>${esc(head)}</b>${items.length ? `<span class="lv-chk-count">${done}/${items.length}</span>` : ''}</div>
    ${tr.desc ? `<p class="lv-chk-desc">${esc(tr.desc)}</p>` : ''}
    ${items.length
      ? `<ul class="lv-check">${items.map(x => `<li class="${live.checks[x.id] ? 'done' : ''}"><label><input type="checkbox" data-check="${esc(x.id)}"${live.checks[x.id] ? ' checked' : ''}>${catTag(x.cat)}<span class="txt">${esc(x.text)}</span></label></li>`).join('')}</ul>`
      : '<p class="lv-chk-desc">Sem ações nesta transição.</p>'}
  </div>`;
}

function statusHTML(L, day) {
  if (!L.rows.length) return '<div class="lv-label">Desvio</div><div class="lv-delay">—</div>';
  const d = Math.round(L.delayMs / 60000);
  const cls = d >= 5 ? 'bad' : d >= 1 ? 'warn' : d <= -1 ? 'good' : '';
  const label = !L.active ? 'Arranque' : L.ended ? 'Resultado final' : 'Desvio acumulado';
  const txt = !L.active && d <= 0 ? 'No horário' : d > 0 ? `${fmtDur(d)} de atraso` : d < 0 ? `${fmtDur(-d)} adiantado` : 'No horário';
  let limit = '';
  if (L.limitMs != null) {
    const over = Math.round(L.overLimitMs / 60000);
    limit = over > 0
      ? `<div class="lv-alert bad">${icon('alert')} Ultrapassa a hora limite (${fmtClock(L.limitMs)}) em ${fmtDur(over)}</div>`
      : `<div class="lv-alert ok">${icon('check')} Margem até à hora limite (${fmtClock(L.limitMs)}): ${fmtDur(-over)}</div>`;
  }
  const rehearsal = day.date && day.date !== toISO(new Date(L.base))
    ? `<div class="lv-alert info">Ensaio: as horas contam a partir de hoje. O evento está marcado para ${esc(longDate(day.date))}.</div>` : '';
  return `<div class="lv-label">${label}</div>
    <div class="lv-delay ${cls}">${txt}</div>
    <div class="lv-endline">Fim previsto <b>${fmtClock(L.plannedEnd)}</b> · ${L.ended ? 'real' : 'projetado'} <b>${fmtClock(L.projEnd)}</b></div>
    ${limit}${rehearsal}`;
}

function programRows(L) {
  const head = '<li class="lv-row head"><span>Previsto</span><span>Real / proj.</span><span>Momento</span><span class="c4">Duração</span><span>Desvio</span></li>';
  return head + L.rows.map(r => {
    const m = r.m;
    const type = m.kind === 'block' ? m.block.type : 'trans';
    const sub = m.kind === 'block'
      ? [m.block.owner, m.block.songs.length ? plural(m.block.songs.length, 'música', 'músicas') : ''].filter(Boolean).join(' · ')
      : m.trans.desc;
    let real = '', dur = fmtDur(r.eff / 60000), dl = null;
    if (r.status === 'done') {
      real = r.as != null ? fmtClock(r.as) : '—';
      if (r.as != null && r.ae != null) dur = fmtDur((r.ae - r.as) / 60000);
      if (r.as != null) dl = Math.round((r.as - r.ps) / 60000);
    } else if (r.status === 'current') { real = fmtClock(r.as); dl = Math.round((r.as - r.ps) / 60000); }
    else if (r.js != null) { real = `<span class="proj">~${fmtClock(r.js)}</span>`; dl = Math.round((r.js - r.ps) / 60000); }
    const dlTxt = dl == null ? '' : dl > 0 ? '+' + dl : dl < 0 ? '−' + -dl : '0';
    const dlCls = dl == null ? '' : dl >= 5 ? 'dl-bad' : dl >= 1 ? 'dl-pos' : dl <= -1 ? 'dl-neg' : '';
    return `<li class="lv-row ${r.status} t-${type}"><span>${fmtClock(r.ps)}</span><span>${real}</span><span class="c3"><b>${esc(momentTitle(m))}</b>${sub ? `<small>${esc(sub)}</small>` : ''}</span><span class="c4">${dur}</span><span class="${dlCls}">${dlTxt}</span></li>`;
  }).join('');
}

function countInfo(L, t) {
  if (!L.rows.length) return { label: '', text: '—', over: false };
  if (!L.active) {
    const d = L.rows[0].ps - t;
    return d >= 0 ? { label: 'Faltam', text: fmtCount(d), over: false } : { label: 'Início em atraso', text: '+' + fmtCount(-d), over: true };
  }
  if (L.ended || L.remaining == null) return { label: '', text: '—', over: false };
  return L.remaining >= 0 ? { label: 'Faltam', text: fmtCount(L.remaining), over: false } : { label: 'Tempo excedido', text: '+' + fmtCount(-L.remaining), over: true };
}

function put(id, html) {
  const el = document.getElementById(id);
  if (!el) return;
  if (el.dataset.filled && putCache.get(id) === html) return;
  el.innerHTML = html; el.dataset.filled = '1'; putCache.set(id, html);
}

function tickLive() {
  if (settings.mode !== 'live') return;
  const day = liveDay();
  const L = computeLive(day);
  const t = now();
  put('lv-clock', clockHTML(t));
  put('lv-date', esc(cap(longDateMs(t))));
  put('lv-status', statusHTML(L, day));
  put('lv-prog-list', programRows(L));
  const c = $('#lv-count');
  if (c) {
    const info = countInfo(L, t);
    c.textContent = info.text;
    c.classList.toggle('over', info.over);
    const lab = $('#lv-countlabel'); if (lab) lab.textContent = info.label;
  }
  const bar = $('#lv-bar');
  if (bar && L.cur) {
    const pct = L.cur.eff > 0 ? Math.min(100, Math.max(0, ((t - L.cur.as) / L.cur.eff) * 100)) : 100;
    bar.style.width = pct + '%';
    $('#lv-barwrap').classList.toggle('over', L.remaining < 0);
  }
  $$('[data-proj-row]').forEach(el => { const r = L.rows[+el.dataset.projRow]; if (r && r.js != null) el.textContent = '~' + fmtClock(r.js); });
}
function startTick() {
  stopTick();
  const loop = () => { tickLive(); tickTimer = setTimeout(loop, 1000 - (Date.now() % 1000) + 15); };
  loop();
}
function stopTick() { clearTimeout(tickTimer); tickTimer = null; }

function liveStart() {
  const day = liveDay();
  const L = computeLive(day);
  if (!L.rows.length) return;
  const t = now();
  const checks = live.checks;
  live = emptyLive();
  live.checks = checks;
  live.dayId = day.id; live.base = defaultBase(day); live.startedAt = t;
  live.currentKey = L.rows[0].m.key; live.starts[live.currentKey] = t;
  settings.liveDayId = day.id;
  lastAdvance = t;
  saveNow(); renderAll();
}
function liveAdvance() {
  const day = liveDay();
  const L = computeLive(day);
  if (!L.active) { liveStart(); return; }
  if (L.ended || !L.cur) return;
  const t = now();
  if (t - lastAdvance < 1200) return; // evita duplo toque
  lastAdvance = t;
  if (L.idx >= L.rows.length - 1) { live.history.push({ type: 'end' }); live.endedAt = t; }
  else {
    live.history.push({ type: 'adv', prev: L.cur.m.key });
    const k = L.rows[L.idx + 1].m.key;
    live.currentKey = k; live.starts[k] = t;
  }
  saveNow(); renderAll();
}
async function liveUndo() {
  if (!live.startedAt) return;
  const h = live.history.pop();
  if (!h) {
    const ok = await ask('Anular o início do acompanhamento? A hora real de início é apagada.', { ok: 'Anular início', danger: true });
    if (!ok) return;
    const checks = live.checks; live = emptyLive(); live.checks = checks;
  } else if (h.type === 'end') live.endedAt = null;
  else {
    delete live.starts[live.currentKey];
    delete live.adjust[live.currentKey];
    live.currentKey = h.prev;
  }
  lastAdvance = 0;
  saveNow(); renderAll();
  toast('Último avanço desfeito');
}
function liveAdjust(delta) {
  const L = computeLive(liveDay());
  if (!L.cur) return;
  const k = L.cur.m.key;
  const v = Math.min(600, Math.max(-L.cur.m.duration, (live.adjust[k] || 0) + delta));
  if (v) live.adjust[k] = v; else delete live.adjust[k];
  saveNow(); renderLive();
}
async function liveReset() {
  const ok = await ask('Reiniciar o acompanhamento ao vivo? Apaga as horas reais, os ajustes e as marcações das checklists.', { ok: 'Reiniciar', danger: true });
  if (!ok) return;
  live = emptyLive();
  saveNow(); renderAll();
  toast('Acompanhamento reiniciado');
}
async function changeLiveDay(sel) {
  const id = sel.value;
  if (live.startedAt && live.dayId !== id) {
    const ok = await ask('Mudar de dia termina o acompanhamento em curso. Continuar?', { ok: 'Mudar de dia' });
    if (!ok) { sel.value = live.dayId; return; }
    live = emptyLive();
  }
  settings.liveDayId = id;
  saveNow(); renderAll();
}

async function requestWake() {
  if (!('wakeLock' in navigator) || document.visibilityState !== 'visible' || wakeLock) return;
  try {
    wakeLock = await navigator.wakeLock.request('screen');
    wakeLock.addEventListener('release', () => { wakeLock = null; renderTopbar(); });
  } catch (_) { wakeLock = null; }
  renderTopbar();
}
function releaseWake() { if (wakeLock) { const w = wakeLock; wakeLock = null; w.release().catch(() => {}); } }
function toggleWake() {
  if (wakeLock) { settings.wake = false; releaseWake(); renderTopbar(); }
  else { settings.wake = true; requestWake(); }
  save();
}
const canFullscreen = () => !!(document.fullscreenEnabled || document.webkitFullscreenEnabled);
function toggleFullscreen() {
  const d = document, el = d.documentElement;
  try {
    const p = d.fullscreenElement || d.webkitFullscreenElement
      ? (d.exitFullscreen || d.webkitExitFullscreen).call(d)
      : (el.requestFullscreen || el.webkitRequestFullscreen).call(el);
    if (p && p.catch) p.catch(() => {});
  } catch (_) {}
}

/* ================= Modo e tema ================= */
function setMode(m) {
  settings.mode = ['live', 'posts'].includes(m) ? m : 'plan';
  if (settings.mode !== 'posts' && /^#(postos|esquema)$/.test(location.hash)) history.replaceState(null, '', location.pathname + location.search);
  save();
  renderAll();
  if (settings.mode === 'live') { startTick(); if (settings.wake) requestWake(); }
  else { stopTick(); releaseWake(); }
  window.scrollTo(0, 0);
}
function cycleTheme() {
  const key = settings.mode === 'live' ? 'themeLive' : 'themePlan';
  const order = ['auto', 'light', 'dark'];
  settings[key] = order[(order.indexOf(settings[key]) + 1) % order.length];
  save(); applyTheme(); renderTopbar();
  toast({ auto: 'Tema automático (segue o sistema)', light: 'Tema claro', dark: 'Tema escuro' }[settings[key]] + (settings.mode === 'live' ? ' no modo ao vivo' : ' no planeamento'));
}

/* ================= Aviso flutuante ================= */
let toastTimer = null;
function toast(msg, undoFn) {
  const el = $('#toast');
  el.innerHTML = `<span>${esc(msg)}</span>${undoFn ? '<button type="button">Anular</button>' : ''}`;
  if (undoFn) el.querySelector('button').addEventListener('click', () => { hideToast(); undoFn(); });
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(hideToast, undoFn ? 7000 : 3200);
}
function hideToast() { $('#toast').classList.remove('show'); }

/* ================= Arrastar para reordenar (rato e toque) ================= */
let drag = null;
function initDrag() {
  document.addEventListener('pointerdown', e => {
    const h = e.target.closest('[data-drag]');
    if (!h || e.button > 0) return;
    const li = h.closest('.tl-block');
    if (!li) return;
    e.preventDefault();
    drag = { li, id: li.dataset.id, from: +li.dataset.index, y0: e.clientY + window.scrollY, pid: e.pointerId, others: $$('#timeline .tl-block').filter(x => x !== li), target: null };
    try { h.setPointerCapture(e.pointerId); } catch (_) {}
    li.classList.add('dragging');
    document.body.classList.add('is-dragging');
  });
  document.addEventListener('pointermove', e => {
    if (!drag || e.pointerId !== drag.pid) return;
    e.preventDefault();
    const y = e.clientY;
    if (y < 80) window.scrollBy(0, -14); else if (y > window.innerHeight - 80) window.scrollBy(0, 14);
    drag.li.style.transform = `translateY(${y + window.scrollY - drag.y0}px)`;
    let t = 0;
    drag.others.forEach(o => { const r = o.querySelector('.tl-card').getBoundingClientRect(); if (y > r.top + r.height / 2) t++; });
    drag.target = t;
    drag.others.forEach(o => o.classList.remove('drop-before', 'drop-after'));
    if (t < drag.others.length) drag.others[t].classList.add('drop-before');
    else if (drag.others.length) drag.others[drag.others.length - 1].classList.add('drop-after');
  }, { passive: false });
  const end = e => {
    if (!drag || e.pointerId !== drag.pid) return;
    const d = drag; drag = null;
    d.li.classList.remove('dragging'); d.li.style.transform = '';
    d.others.forEach(o => o.classList.remove('drop-before', 'drop-after'));
    document.body.classList.remove('is-dragging');
    if (e.type === 'pointercancel' || d.target == null || d.target === d.from) return;
    const day = planDay();
    const i = day.blocks.findIndex(b => b.id === d.id);
    if (i < 0) return;
    const before = undoPoint(), pairs = adjacentKeys(day);
    const [b] = day.blocks.splice(i, 1);
    day.blocks.splice(d.target, 0, b);
    afterReorder(day, before, pairs, b.id);
  };
  document.addEventListener('pointerup', end);
  document.addEventListener('pointercancel', end);
}

/* ================= Eventos ================= */
const actions = {
  mode: el => setMode(el.dataset.mode),
  theme: () => cycleTheme(),
  print: () => doPrint(),
  export: () => exportJSON(),
  import: () => $('#import-file').click(),
  'reset-example': () => resetExample(),
  'update-apply': () => applyPending(),
  'update-keep': () => keepMine(),
  'update-reload': () => location.reload(),
  'day-select': el => { settings.dayId = el.dataset.day; save(); renderAll(); },
  'day-add': () => addDay(),
  'day-edit': () => editDay(planDay()),
  'event-edit': () => editEvent(),
  'block-add': () => editBlock(planDay(), null, planDay().blocks.length),
  'block-insert': el => editBlock(planDay(), null, +el.dataset.at),
  'block-edit': el => editBlock(planDay(), el.dataset.id),
  'block-dup': el => dupBlock(planDay(), el.dataset.id),
  'block-del': el => delBlock(planDay(), el.dataset.id),
  'block-up': el => moveBlock(planDay(), el.dataset.id, -1),
  'block-down': el => moveBlock(planDay(), el.dataset.id, 1),
  'trans-edit': el => editTrans(planDay(), el.dataset.from, el.dataset.to),
  'post-add': () => editPost(null),
  'post-edit': el => editPost(el.dataset.id),
  'post-dup': el => dupPost(el.dataset.id),
  'post-del': el => delPost(el.dataset.id),
  'post-up': el => movePost(el.dataset.id, -1),
  'post-down': el => movePost(el.dataset.id, 1),
  'show-esquema': () => { uiOpen.esquema = true; setMode('posts'); },
  'esq-zoom': el => el.closest('.esq-fig').classList.toggle('zoomed'),
  'live-start': () => liveStart(),
  'live-advance': () => liveAdvance(),
  'live-undo': () => liveUndo(),
  'live-adjust': el => liveAdjust(+el.dataset.delta),
  'live-reset': () => liveReset(),
  fullscreen: () => toggleFullscreen(),
  wake: () => toggleWake(),
};
document.addEventListener('click', e => {
  $$('details.menu[open]').forEach(m => { if (!m.contains(e.target)) m.open = false; });
  const el = e.target.closest('[data-action]');
  if (!el || el.disabled) return;
  const menu = el.closest('details.menu'); if (menu) menu.open = false;
  const fn = actions[el.dataset.action];
  if (fn) { e.preventDefault(); fn(el, e); }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.matches('[data-check]')) {
    if (t.checked) live.checks[t.dataset.check] = true; else delete live.checks[t.dataset.check];
    saveNow(); renderLive();
  } else if (t.matches('[data-live-day]')) changeLiveDay(t);
  else if (t.id === 'import-file') { const f = t.files && t.files[0]; t.value = ''; if (f) importFile(f); }
});
document.addEventListener('toggle', e => {
  const d = e.target;
  if (d.dataset && d.dataset.remember) uiOpen[d.dataset.remember] = d.open;
  if (d.id === 'esquema' && d.open) loadEsquema();
}, true);
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') $$('details.menu[open]').forEach(m => { m.open = false; });
  if (settings.mode !== 'live' || $('#dlg').open) return;
  if (e.target.closest('input, textarea, select, [contenteditable]')) return;
  if (e.key === 'ArrowRight' || e.key === 'PageDown') { e.preventDefault(); liveAdvance(); }
  else if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') { e.preventDefault(); liveUndo(); }
});
$('#dlg').addEventListener('click', e => { if (e.target === e.currentTarget) closeDialog(); });
window.addEventListener('beforeprint', renderPrint);
window.addEventListener('pagehide', saveNow);
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'visible') return;
  checkRemote();
  if (settings.mode !== 'live') return;
  tickLive();
  if (settings.wake) requestWake();
});
// Sincroniza com outro separador aberto no mesmo navegador.
window.addEventListener('storage', e => {
  if (e.key !== STORAGE_KEY || !e.newValue || $('#dlg').open) return;
  try {
    const d = JSON.parse(e.newValue);
    state = normalizeState(d.state) || state;
    live = normalizeLive(d.live);
    pendingUpdate = false;
    // Uma página antiga (outro separador, ou a que acabou de recarregar) pode gravar uma versão anterior: volta a acertar.
    if (syncPublished()) saveNow();
    renderAll();
  } catch (_) {}
});

/* ================= Arranque ================= */
load();
renderAll();
initDrag();
if (settings.mode === 'live') { startTick(); if (settings.wake) requestWake(); }
saveNow();
if (!storageOk) toast('Armazenamento local indisponível: use Dados › Exportar para guardar uma cópia.');
else if (updatedOnLoad) toast('Alinhamento atualizado para a versão mais recente');
setTimeout(checkRemote, 5000);
setInterval(() => { if (!document.hidden) checkRemote(); }, 60e3);
})();
</script>
